[package]
name = "open-stomp-manager"
description = "Open editor and live monitor for the SORAN Dual Stomp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# the pedal library (protocol, state, connection engine), a sibling checkout of
# https://github.com/JackMechem/open-stomp-lib
open-stomp = { path = "../../../open-stomp-lib", features = ["ble"] }
tauri = { version = "2.12", features = [] }
# native file dialogs (Import NAM / IR, Replay capture)
tauri-plugin-dialog = "2.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# attach to the launching console so --help / --version print in release (GUI-subsystem) builds
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
