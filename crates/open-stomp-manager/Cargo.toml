[package]
name = "open-stomp-manager"
description = "Open editor / monitor for the SORAN Dual Stomp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# the pedal library (protocol, state, connection engine), a sibling checkout of
# https://github.com/JackMechem/open-stomp-lib
open-stomp = { path = "../../../open-stomp-lib" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.36"
egui-phosphor = "0.14"
# native file dialogs (Import NAM…); on Linux via the XDG desktop portal (D-Bus), no GTK
rfd = "0.17"
# waits for the file dialog off the UI thread
pollster = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
# attach to the launching console so --help / --version print in release (GUI-subsystem) builds
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
