[package]
name = "open-stomp-manager"
description = "Open editor / monitor for the SORAN Dual Stomp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stomp-proto = { path = "../stomp-proto" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.36"
egui-phosphor = "0.14"
midir = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
# pump the engine thread's run loop so CoreMIDI can deliver device add/remove notifications
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
# attach to the launching console so --help / --version print in release (GUI-subsystem) builds
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
