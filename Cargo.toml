[workspace]
resolver = "3"
members = ["crates/open-stomp-manager"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JackMechem/open-stomp-manager"

[profile.release]
lto = "thin"
codegen-units = 4

# the NAM conversion (open-stomp + rustfft) is far too slow unoptimised; keep debug builds usable
[profile.dev.package.open-stomp]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
