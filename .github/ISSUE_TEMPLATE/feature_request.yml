name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem you're trying to solve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How you imagine it working. A sketch or a comparison with the official app helps.
