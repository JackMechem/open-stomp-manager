name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # the open-stomp library is a path dependency on a sibling checkout (crates/open-stomp-manager/Cargo.toml)
  # nam-upload until open-stomp-lib v0.3.0 is tagged; switch to v0.3.0 at release
  OPEN_STOMP_LIB_REF: nam-upload

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out open-stomp-lib next to this repo
        shell: bash
        run: git clone --depth 1 --branch "$OPEN_STOMP_LIB_REF" https://github.com/JackMechem/open-stomp-lib ../open-stomp-lib
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p open-stomp-manager

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out open-stomp-lib next to this repo
        shell: bash
        run: git clone --depth 1 --branch "$OPEN_STOMP_LIB_REF" https://github.com/JackMechem/open-stomp-lib ../open-stomp-lib
      - uses: dtolnay/rust-toolchain@1.95
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  version:
    name: version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: packaging/check-version.sh
