name: Release

# Push a tag `vX.Y.Z` matching the workspace version to build and publish binaries. A tag with a
# pre-release suffix (vX.Y.Z-beta.N) is published as a pre-release. channels.yml then moves the
# stable / unstable branches.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # the open-stomp library is a path dependency on a sibling checkout (crates/open-stomp-manager/Cargo.toml)
  OPEN_STOMP_LIB_REF: v0.6.1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc = runs on more distros
          - name: macos-universal
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml
        shell: bash
        run: packaging/check-version.sh "${GITHUB_REF_NAME#v}"
      - name: Check out open-stomp-lib next to this repo
        shell: bash
        run: git clone --depth 1 --branch "$OPEN_STOMP_LIB_REF" https://github.com/JackMechem/open-stomp-lib ../open-stomp-lib
      - name: Check flake.lock pins the same library
        if: runner.os == 'Linux'
        # the stable / unstable channels are Nix builds of this tag, so they must match the binaries
        run: |
          want=$(git -C ../open-stomp-lib rev-parse HEAD)
          have=$(jq -r '.nodes["open-stomp-lib"].locked.rev' flake.lock)
          [[ "$have" == "$want" ]] || {
            echo "::error::flake.lock pins open-stomp-lib $have, but $OPEN_STOMP_LIB_REF is $want (nix flake update open-stomp-lib)"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install ALSA and D-Bus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p open-stomp-manager
          d=open-stomp-manager-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p $d
          cp target/release/open-stomp-manager packaging/open-stomp-manager.desktop README.md CHANGELOG.md $d/
          cp packaging/icons/icon.png $d/open-stomp-manager.png
          tar czf $d.tar.gz $d
          echo "ASSET=$d.tar.gz" >> $GITHUB_ENV
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/bundle.sh
          d=open-stomp-manager-${GITHUB_REF_NAME}-${{ matrix.name }}
          ditto -c -k --keepParent "target/macos/Open Stomp Manager.app" $d.zip
          echo "ASSET=$d.zip" >> $GITHUB_ENV
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p open-stomp-manager
          d=open-stomp-manager-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p $d
          cp target/release/open-stomp-manager.exe README.md CHANGELOG.md $d/
          7z a $d.zip $d
          echo "ASSET=$d.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # a pre-release (vx.y.z-beta.n) needs no section of its own: fall back to [Unreleased]
          [[ -s notes.md || "$v" != *-* ]] || awk '/^## \[/{p = index($0, "[Unreleased]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body_path: notes.md
