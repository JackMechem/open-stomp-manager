name: Release

# Push a tag `vX.Y.Z` matching the workspace version to build and publish binaries. A tag with a
# pre-release suffix (vX.Y.Z-beta.N) is published as a pre-release. channels.yml then moves the
# stable / unstable branches.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # the open-stomp library is a path dependency on a sibling checkout (app/src-tauri/Cargo.toml)
  OPEN_STOMP_LIB_REF: v0.6.1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc = runs on more distros
          - name: macos-universal
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml
        shell: bash
        run: packaging/check-version.sh "${GITHUB_REF_NAME#v}"
      - name: Check out open-stomp-lib next to this repo
        shell: bash
        run: git clone --depth 1 --branch "$OPEN_STOMP_LIB_REF" https://github.com/JackMechem/open-stomp-lib ../open-stomp-lib
      - name: Check flake.lock pins the same library
        if: runner.os == 'Linux'
        # the stable / unstable channels are Nix builds of this tag, so they must match the binaries
        run: |
          want=$(git -C ../open-stomp-lib rev-parse HEAD)
          have=$(jq -r '.nodes["open-stomp-lib"].locked.rev' flake.lock)
          [[ "$have" == "$want" ]] || {
            echo "::error::flake.lock pins open-stomp-lib $have, but $OPEN_STOMP_LIB_REF is $want (nix flake update open-stomp-lib)"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install ALSA, D-Bus and WebKitGTK headers
        if: runner.os == 'Linux'
        # patchelf: for the AppImage
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # `tauri build` builds the frontend (pnpm build), the app and the installers. The assets get
      # stable names: open-stomp-manager-<tag>-<platform>.<ext>
      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runner
        run: |
          pnpm tauri build --bundles deb,rpm,appimage
          b=../target/release/bundle
          p=open-stomp-manager-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p ../out
          cp $b/deb/*.deb ../out/$p.deb
          cp $b/rpm/*.rpm ../out/$p.rpm
          cp $b/appimage/*.AppImage ../out/$p.AppImage
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        # ad-hoc signed, not notarized (signingIdentity "-" in tauri.conf.json)
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          b=../target/universal-apple-darwin/release/bundle
          p=open-stomp-manager-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p ../out
          cp $b/dmg/*.dmg ../out/$p.dmg
          ditto -c -k --keepParent "$b/macos/Open Stomp Manager.app" ../out/$p.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash
        # the installer adds the WebView2 runtime if Windows lacks it; the zip relies on it being there
        run: |
          pnpm tauri build --bundles nsis
          p=open-stomp-manager-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p ../out/$p
          cp ../target/release/bundle/nsis/*-setup.exe ../out/$p-setup.exe
          cp ../target/release/open-stomp-manager.exe ../README.md ../CHANGELOG.md ../out/$p/
          (cd ../out && 7z a $p.zip $p && rm -r $p)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # a pre-release (vx.y.z-beta.n) needs no section of its own: fall back to [Unreleased]
          [[ -s notes.md || "$v" != *-* ]] || awk '/^## \[/{p = index($0, "[Unreleased]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body_path: notes.md
